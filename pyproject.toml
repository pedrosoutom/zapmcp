[project]
name = "zapmcp"
version = "0.3.5"
description = "Contexto do WhatsApp Desktop (Mac) para o Claude, via MCP"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "fastmcp>=4.0.10",
    "numpy>=2.5.3",
    "openpyxl>=3.1.5",
    "pillow>=12.3.0",
    "pypdfium2>=5.13.0",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
    "pywhispercpp>=1.5.1",
]

[project.urls]
Repository = "https://github.com/pedrosoutom/zapmcp"

[project.scripts]
zapmcp = "zapmcp.cli:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
